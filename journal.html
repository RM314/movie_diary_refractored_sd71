<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journal | Movie Diary</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Gowun Dodum Font -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            // Custom font family
            fontFamily: {
              'gowun': ['"Gowun Dodum"', 'sans-serif'],
            },
            // Custom color palette
            colors: {
              'navy': '#264653',
              'teal': '#2A9D8F',
              'sand': '#E9C46A',
              'orange': '#F4A261',
              'coral': '#E76F51',
            }
          }
        }
      }
    </script>
      <!-- Global Font Style -->
      <style>
        * {
          font-family: 'Gowun Dodum', sans-serif;
        }
      </style>
  </head>
  <body class="bg-white text-navy">
    <!-- Navigation -->
    <nav class="mx-4 mt-4">
      <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
        <!-- Logo -->
        <a href="index.html" class="justify-self-start">
          <img src="./assets/logo_movie_diary.png" alt="Movie Diary Logo" class="h-10">
        </a>

        <!-- Nav Links -->
        <div class="flex items-center gap-4">
          <a href="index.html" class="text-sm hover:text-teal transition-colors">Home</a>
          <a href="journal.html" class="text-sm text-teal transition-colors">Journal</a>
        </div>

        <!-- Spacer for alignment -->
        <div class="w-48"></div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-navy">Your Journal</h2>
        <p class="text-navy/70 text-sm">Your favourite movies + personal notes.</p>
      </div>

      <ul id="favList" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></ul>
    </main>

    <script type="module" src="./src/journal.js"></script>
  </body>
</html>
