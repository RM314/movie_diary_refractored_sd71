<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journal | Movie Diary</title>

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Gowun Dodum Font -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-navy">
    <!-- Navigation -->
    <nav class="mx-4 mt-4">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <!-- <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between"> -->
        <!-- Logo -->
        <a href="index.html" class="justify-self-start">
          <img src="./assets/logo_movie_diary.png" alt="Movie Diary Logo" class="h-10">
        </a>


      <!-- Navigation Links -->
      <!-- ############################################################################## -->
      <div class="hidden sm:flex items-center gap-6 order-last sm:order-none w-full sm:w-auto justify-center">
      <!-- ############################################################################## -->
        <a href="index.html" class="text-sm hover:text-teal transition-colors">Home</a>
        <a href="journal.html" class="text-sm hover:text-teal transition-colors">Journal</a>
      </div>

    <!-- ############################################################################## -->
        <!-- Burger (nur Mobile) -->
        <button
          id="burgerBtn"
          class="sm:hidden inline-flex items-center justify-center rounded-md p-2 hover:bg-sand"
          type="button"
        >
          <!-- simple icon -->
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
    <!-- ############################################################################## -->

    <!-- ############################################################################## -->
    <!-- Mobile Dropdown Menu  -->
    <div
      id="mobileMenu"
      class="hidden sm:hidden w-full order-last border-t border-navy/20 pt-3"
    >
      <div class="flex flex-col gap-2">
        <a href="index.html" class="py-2 text-sm hover:text-teal transition-colors">Home</a>
        <a href="journal.html" class="py-2 text-sm hover:text-teal transition-colors">Journal</a>
      </div>
    </div>
    <!-- ############################################################################## -->

        <!-- Spacer for alignment -->
        <div class="hidden sm:block w-48"></div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-navy">Your Journal</h2>
        <p class="text-navy/70 text-sm">Your favourite movies + personal notes.</p>
      </div>

      <ul id="favList" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></ul>
    </main>

    <script type="module" src="./src/journal.js"></script>
  </body>
</html>
