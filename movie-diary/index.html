<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Diary</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <nav class="bg-white border-b border-slate-200">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <a class="font-bold" href="index.html">Movie Diary</a>
        <div class="flex gap-4 text-sm">
          <a class="hover:underline" href="index.html">Home</a>
          <a class="hover:underline" href="journal.html">Journal</a>
        </div>
      </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-6">
      <div class="flex flex-col md:flex-row md:items-end gap-3 justify-between">
        <div>
          <h1 class="text-2xl font-bold">Popular Movies</h1>
          <p class="text-slate-600 text-sm">Browse popular titles or search for any movie.</p>
        </div>

        <form id="searchForm" class="flex gap-2">
          <input
            id="searchInput"
            class="w-64 rounded-lg border border-slate-300 px-3 py-2 text-sm"
            placeholder="Search movies..."
            required
          />
          <button class="rounded-lg bg-slate-900 text-white px-4 py-2 text-sm hover:bg-slate-800">
            Search
          </button>
        </form>
      </div>

      <section class="mt-6">
        <ul id="popularList" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></ul>
      </section>
    </main>

    <dialog id="searchDialog" class="rounded-xl p-0 w-[min(900px,95vw)]">
      <div class="bg-white">
        <div class="p-4 border-b border-slate-200 flex items-center justify-between">
          <h2 class="font-semibold">Search results</h2>
          <button id="closeDialog" class="text-sm underline">Close</button>
        </div>
        <div class="p-4">
          <p id="searchStatus" class="text-sm text-slate-600 mb-3"></p>
          <ul id="searchList" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></ul>
        </div>
      </div>
    </dialog>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
